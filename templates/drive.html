{% extends "base.html" %}
{% block title %}{{ field.name }} · Drive{% endblock %}
{% block content %}
<div class="drive-header">
  <div>
    <div class="eyebrow">{{ farm.name }}</div>
    <h1>{{ field.name }}</h1>
  </div>
  <a class="secondary button-link" href="{{ url_for('farm_page', farm_id=farm.id) }}">Exit field</a>
</div>

<div class="drive-card">
  {% if field.route_ready %}
    <img class="route-image"
         src="{{ url_for('field_route_overlay', farm_id=farm.id, field_id=field.id) }}"
         alt="Saved route">
  {% else %}
    <div class="empty-state">This field needs a route generated before it can be worked offline.</div>
  {% endif %}
</div>

<div class="drive-controls">
  <button class="primary huge" disabled>Start guidance — next stage</button>
</div>
{% endblock %}
