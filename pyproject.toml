[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtk-satellite"
version = "0.2.0"
description = "Fetch a satellite image for an RTK-fixed Raspberry Pi position"
requires-python = ">=3.11"
dependencies = [
    "pyserial==3.5",
    "requests==2.32.5",
    "Pillow>=10.0,<13",
]

[project.scripts]
rtk-satellite = "rtk_satellite.cli:main"

[tool.setuptools]
packages = ["rtk_satellite"]
